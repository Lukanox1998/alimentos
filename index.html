<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Dashboard Supermercado — CSV desde GitHub</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>
  <h1>Dashboard — Precios & Ventas</h1>
  <div id="chart_div" style="width:100%; height:500px;"></div>

<script>
google.charts.load('current', { packages: ['corechart', 'table'] });
google.charts.setOnLoadCallback(loadCSV);

function loadCSV() {
  // URL RAW del CSV en tu repo
  const csvUrl = "https://raw.githubusercontent.com/Lukanox1998/alimentos/main/alimentos supermarket - Hoja 1.csv";

  fetch(csvUrl)
    .then(response => {
      if (!response.ok) throw new Error("Network response was not ok");
      return response.text();
    })
    .then(text => {
      const rows = text.trim().split("\n").map(line => line.split(","));
      // Asumiendo que la primera fila es encabezados
      const headers = rows.shift();
      // Crear DataTable
      const data = new google.visualization.DataTable();
      // Ajusta nombres y tipos según tus columnas
      data.addColumn('string', 'Producto');
      data.addColumn('number', 'Precio_2024');
      data.addColumn('number', 'Precio_2025');
      // Ignora columnas extras por simplicidad
      rows.forEach(r => {
        const prod = r[1];
        const p24 = parseFloat(r[2]);
        const p25 = parseFloat(r[3]);
        if (!isNaN(p24) && !isNaN(p25)) {
          data.addRow([prod, p24, p25]);
        }
      });
      // Dibujar gráfico como ejemplo — puedes adaptar
      const chart = new google.visualization.ColumnChart(document.getElementById('chart_div'));
      chart.draw(data, { title: 'Precios 2024 vs 2025', legend: 'top' });
    })
    .catch(err => {
      console.error("Error al cargar CSV:", err);
      alert("No se pudo cargar el CSV. Revisa la consola.");
    });
}
</script>
</body>
</html>
