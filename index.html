<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Supermercado — Precios y Ventas</title>
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script>
    // 1) Carga la librería corechart (ColumnChart, LineChart, etc.)
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(drawAll);

    function drawAll() {
      // --- DATOS: cada fila = [Producto, precio2024, precio2025, ventas2024, ventas2025]
      const rows = [
        ["Manzanas",25,28,530,610],
        ["Plátanos",22,24,720,680],
        ["Naranjas",26,29,690,720],
        ["Leche entera",24,27,890,910],
        ["Leche deslactosada",26,29,810,830],
        ["Yogur natural",18,20,600,650],
        ["Huevo blanco",38,42,900,940],
        ["Huevo rojo",42,45,850,880],
        ["Pan de caja",34,37,520,560],
        ["Pan dulce",15,17,400,430],
        ["Azúcar",32,36,780,820],
        ["Sal",12,14,450,470],
        ["Arroz",28,30,910,940],
        ["Frijol negro",32,34,850,880],
        ["Lentejas",30,33,700,740],
        ["Aceite vegetal",48,55,680,710],
        ["Aceite de oliva",95,105,320,340],
        ["Mantequilla",48,52,510,540],
        ["Margarina",34,37,470,500],
        ["Jabón de pastilla",16,17,300,320],
        ["Jabón líquido",28,32,380,400],
        ["Shampoo",42,46,410,430],
        ["Pasta dental",32,34,450,470],
        ["Cloro",18,20,500,530],
        ["Suavizante",36,39,420,440],
        ["Arándanos",45,49,330,360],
        ["Uvas",58,63,370,400],
        ["Piña",34,38,320,340],
        ["Papaya",30,33,290,310],
        ["Mango",22,25,360,380],
        ["Pasta spaghetti",22,25,530,560],
        ["Atún en lata",19,22,670,690],
        ["Sardina",18,20,420,430],
        ["Galletas",28,32,510,530],
        ["Chocolate en polvo",42,46,480,500],
        ["Refresco cola",18,20,820,840],
        ["Refresco naranja",17,20,760,790],
        ["Agua 1L",14,15,900,930],
        ["Jugo natural",24,27,520,550],
        ["Energética",38,42,440,460],
        ["Café molido",89,95,480,500],
        ["Café soluble",75,80,520,540],
        ["Té verde",28,30,350,370],
        ["Té negro",26,29,300,330],
        ["Detergente polvo",38,42,460,470],
        ["Detergente líquido",42,46,420,430],
        ["Suero hidratante",22,25,380,390],
        ["Vitaminas",95,105,210,230],
        ["Proteína en polvo",250,270,80,90],
        ["Barritas energéticas",18,21,310,330]
      ];


      // -----------------------------
      const dt1 = new google.visualization.DataTable();
      dt1.addColumn('string', 'Producto');
      dt1.addColumn('number', 'Precio 2024');
      dt1.addColumn('number', 'Precio 2025');
      rows.forEach(r => dt1.addRow([r[0], r[1], r[2]]));

      const chart1 = new google.visualization.ColumnChart(document.getElementById('chart_prices_compare'));
      chart1.draw(dt1, {
        title: 'Precios 2024 vs 2025 (todos los productos)',
        legend: { position: 'top' },
        height: 400
      });


      // -----------------------------
      const top2024 = rows.slice().sort((a,b) => b[3] - a[3]).slice(0,3);
      const dt2 = new google.visualization.DataTable();
      dt2.addColumn('string','Producto');
      dt2.addColumn('number','Ventas 2024');
      top2024.forEach(r => dt2.addRow([r[0], r[3]]));

      const chart2 = new google.visualization.ColumnChart(document.getElementById('chart_top2024'));
      chart2.draw(dt2, {
        title: 'Top 3 productos más vendidos (2024)',
        legend: { position: 'none' },
        height: 300,
        colors: ['#3366CC']
      });

      const top2025 = rows.slice().sort((a,b) => b[4] - a[4]).slice(0,3);
      const dt3 = new google.visualization.DataTable();
      dt3.addColumn('string','Producto');
      dt3.addColumn('number','Ventas 2025');
      top2025.forEach(r => dt3.addRow([r[0], r[4]]));

      const chart3 = new google.visualization.ColumnChart(document.getElementById('chart_top2025'));
      chart3.draw(dt3, {
        title: 'Top 3 productos más vendidos (2025)',
        legend: { position: 'none' },
        height: 300,
        colors: ['#DC3912']
      });

      // -----------------------------
      // Gráfica 4: Precios de todos los productos (colores)
      // -----------------------------
      const dt4 = new google.visualization.DataTable();
      dt4.addColumn('string','Producto');
      dt4.addColumn('number','Precio 2025');
      rows.forEach(r => dt4.addRow([r[0], r[2]]));

      const chart4 = new google.visualization.BarChart(document.getElementById('chart_all_prices'));
      chart4.draw(dt4, {
        title: 'Precios 2025 — Todos los productos',
        legend: { position: 'none' },
        height: 600,
        colors: ['#109618']
      });

    }
  </script>
</head>

<body>
  <h1 style="text-align:center;">Dashboard Supermercado</h1>

  <h2>1. Precios 2024 vs 2025</h2>
  <div id="chart_prices_compare" style="width:100%;"></div>

  <h2>2. Top 3 vendidos en 2024</h2>
  <div id="chart_top2024" style="width: 60%; margin:auto;"></div>

  <h2>3. Top 3 vendidos en 2025</h2>
  <div id="chart_top2025" style="width: 60%; margin:auto;"></div>

  <h2>4. Precios 2025 de todos los productos</h2>
  <div id="chart_all_prices" style="width:100%;"></div>
</body>
</html>
