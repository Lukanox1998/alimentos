<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dashboard Supermercado</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <script>
        google.charts.load('current', { packages: ['corechart', 'table'] });
        google.charts.setOnLoadCallback(loadData);

        function loadData() {

            const url = "https://raw.githubusercontent.com/Lukanox1998/alimentos/refs/heads/main/alimentos%20supermarket%20-%20Hoja%201.csv";

            fetch(url)
                .then(response => response.text())
                .then(csvText => {
                    const data = new google.visualization.DataTable();

                    // DEFINIR COLUMNAS
                    data.addColumn('string', 'Producto');
                    data.addColumn('number', 'Precio 2024');
                    data.addColumn('number', 'Precio 2025');
                    data.addColumn('string', 'Caducidad');
                    data.addColumn('string', 'Proveedor');
                    data.addColumn('number', 'Ventas 2024');
                    data.addColumn('number', 'Ventas 2025');

                    // PROCESAR CSV
                    const lines = csvText.split("\n").slice(1); // quitar encabezado

                    lines.forEach(line => {
                        if (line.trim() === "") return;
                        const parts = line.split(",");

                        data.addRow([
                            parts[0],
                            Number(parts[1]),
                            Number(parts[2]),
                            parts[3],
                            parts[4],
                            Number(parts[5]),
                            Number(parts[6])
                        ]);
                    });

                    drawCharts(data);
                });
        }

        function drawCharts(data) {

            // ------ GRÁFICA COMPARATIVA ------
            const chart1 = new google.visualization.ColumnChart(document.getElementById('grafica_comparativa'));
            chart1.draw(data, {
                title: 'Comparativa precios 2024 vs 2025',
                hAxis: { title: 'Producto' },
                vAxis: { title: 'Precio' },
                legend: { position: 'top' }
            });

            // ------ TABLA ------
            const table = new google.visualization.Table(document.getElementById('tabla_productos'));
            table.draw(data);
        }
    </script>
</head>
<body>

    <h1>Dashboard Supermercado</h1>

    <h2>Comparativa precios 2024 vs 2025</h2>
    <div id="grafica_comparativa" style="width: 100%; height: 400px;"></div>

    <h2>Tabla completa de productos</h2>
    <div id="tabla_productos"></div>

</body>
</html>
